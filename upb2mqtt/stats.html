<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPB devices</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --card: #ffffff; --text: #212121; --muted: #727272;
    --line: #e0e0e0; --head: #f3f3f3; --accent: #03a9f4; --hover: #f5f9fc;
    --ok: #2e7d32; --bad: #c62828; --warn-bg: #fdecea;
    --pim-a: #3f51b5; --pim-b: #00897b;  /* which PIM sends to a device */
    --lit: #9a6700;  /* a light that's on: Home Assistant's amber, darkened to read on white */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111; --card: #1c1c1c; --text: #e1e1e1; --muted: #9b9b9b;
      --line: #2f2f2f; --head: #232323; --accent: #4fc3f7; --hover: #242a2e;
      --ok: #81c784; --bad: #ef9a9a; --warn-bg: #3b2020;
      --pim-a: #9fa8da; --pim-b: #4db6ac;
      --lit: #ffca28;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 14px/1.4 Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
  h1 { font-size: 20px; font-weight: 500; margin: 0; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 12px; border: 1px solid currentColor; }
  .pill.on { color: var(--ok); } .pill.off { color: var(--bad); }
  .pims { display: flex; flex-wrap: wrap; gap: 6px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .meta { color: var(--muted); font-size: 13px; }
  /* A device's PIM: a stripe on its name, and a chip ("PIM A", or "PIM A ×2"
     when it's sent twice, outlined) */
  .pim-A { --pim: var(--pim-a); } .pim-B { --pim: var(--pim-b); }
  .dot { background: var(--pim); vertical-align: 1px; }
  tbody td.name[class*=pim-] { box-shadow: inset 4px 0 0 var(--pim); }
  .chip {
    display: inline-block; min-width: 52px; padding: 1px 8px; border-radius: 10px; text-align: center;
    font-size: 12px; font-weight: 500; color: var(--pim); border: 1px solid var(--pim);
    background: color-mix(in srgb, var(--pim) 16%, transparent);
  }
  .chip.repeat { background: transparent; }
  .counts span + span { margin-left: 8px; }
  .counts .dot { margin-right: 4px; }
  .spacer { flex: 1; }
  input[type=search] {
    font: inherit; padding: 6px 10px; min-width: 200px; max-width: 100%;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text);
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: calc(100vh - 90px); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; z-index: 1; }
  tbody td:first-child { background: inherit; }  /* the row's, hover included */
  thead th {
    position: sticky; top: 0; z-index: 1; background: var(--head); font-weight: 500;
    cursor: pointer; user-select: none;
  }
  thead th:first-child, tfoot td:first-child { z-index: 3; }
  thead th:hover { color: var(--accent); }
  thead th[aria-sort] { color: var(--accent); }
  thead th[aria-sort=ascending]::after { content: " \25B2"; font-size: 10px; }
  thead th[aria-sort=descending]::after { content: " \25BC"; font-size: 10px; }
  tbody tr { background: var(--card); }
  tbody tr:hover { background: var(--hover); }
  td.name { font-weight: 500; }
  td.name small { display: block; font-weight: 400; color: var(--muted); }
  .device { display: flex; align-items: center; gap: 6px; }
  button.read {
    flex: none; display: grid; place-items: center; width: 28px; height: 28px; padding: 0;
    border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer;
  }
  button.read:hover:not(:disabled) { color: var(--accent); background: var(--head); }
  button.read:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.read:disabled { cursor: default; opacity: 0.4; }
  button.read.busy { color: var(--accent); }
  button.read.busy svg { animation: spin 1s linear infinite; }
  button.read.ok { color: var(--ok); }
  button.read.fail { color: var(--bad); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { button.read.busy svg { animation: none; } }
  /* A read of all devices in progress */
  .progress { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .progress[hidden] { display: none; }
  .progress .bar { width: 120px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .progress .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
  .pill.querying .dot { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.2; } }
  @media (prefers-reduced-motion: reduce) {
    .pill.querying .dot { animation: none; }
    .progress .bar span { transition: none; }
  }
  .none { color: var(--muted); }
  .lit { color: var(--lit); font-weight: 500; }
  td.warn { color: var(--bad); background: var(--warn-bg); font-weight: 500; }
  tfoot td { font-weight: 500; background: var(--head); position: sticky; bottom: 0; z-index: 2; }
  #error { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>UPB devices</h1>
  <span id="pims" class="pims"><span class="pill">…</span></span>
  <span id="progress" class="progress" hidden
        title="Each device is queried with one transmission first, to learn which PIM reaches it">
    <span id="progress-text"></span>
    <span class="bar" role="progressbar" aria-label="Devices read"><span id="progress-bar"></span></span>
  </span>
  <span id="since" class="meta"></span>
  <span id="error" class="meta"></span>
  <span class="spacer"></span>
  <input id="filter" type="search" placeholder="Filter devices" aria-label="Filter devices">
</header>
<div class="card">
  <table>
    <thead><tr id="columns"></tr></thead>
    <tbody id="rows"></tbody>
    <tfoot><tr id="totals"></tr></tfoot>
  </table>
</div>
<script>
"use strict";
// Columns: key in stats.json, heading, tooltip, how to show a value
const COLUMNS = [
  ["name", "Device", "Name in UPStart, and product"],
  ["unit", "Unit", "UPB unit ID"],
  ["level", "State", "Current level of each channel"],
  ["state_changes", "Changes", "Times its lights changed state"],
  ["sent", "Sent", "Commands the bridge sent to it"],
  ["sent_scene", "Scene", "Scene (link) commands the bridge sent that it hears"],
  ["queries", "Queries", "State reads the bridge sent (not discovery probes it didn't answer)"],
  ["observed", "Observed", "Traffic from anyone else: keypad and local presses, other controllers"],
  ["timeouts", "Timeouts", "Queries it never answered, retry included"],
  ["latency_ms", "Latency", "Reply time of the last state query (ms), from the PIM accepting it"],
  ["tx_count", "TX", "Transmit count in use"],
  ["pim", "Sent via", "PIM that sends to it: the one needing the fewest transmissions. " +
          "×2: no PIM reaches it with one, so it's sent twice"],
  ["last_heard", "Last heard", "When it last sent anything"],
];
// With two PIMs, "Sent via" (PIM and transmit count) replaces TX
const dual = () => (data?.pims?.length ?? 1) > 1;
const columns = () => COLUMNS.filter(([key]) => key !== (dual() ? "tx_count" : "pim"));
let headKeys = "";
const PIM_NAMES = "AB";
const SUMMED = ["state_changes", "sent", "sent_scene", "queries", "observed", "timeouts"];
const REFRESH_MS = 5000;
const FAST_REFRESH_MS = 1000;  // while a device read is outstanding
// A query that misses is retried after 5 s; allow for that and a queue wait
const READ_WAIT_MS = 20000;
const OUTCOME_MS = 4000;
const ICON = "M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 " +
  "19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 " +
  "16.22,7.78L13,11H20V4L17.65,6.35Z";  // mdi:refresh

const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode */ } },
};
let sort = store.get("upb-sort") || { key: "name", dir: 1 };
let data = null;
let timer = null;
const reading = new Map();  // unit -> {heard, timeouts, until}: read requested, no answer yet
const outcomes = new Map();  // unit -> {cls, text, until}: how the last read went

const el = (tag, text, cls) => {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
};

function ago(iso) {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return `${Math.round(s)} s ago`;
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${(s / 3600).toFixed(1)} h ago`;
  return `${(s / 86400).toFixed(1)} d ago`;
}

// Each channel's level ("On" for a relay); lit ones in the "on" colour
function levelCell(levels, dimmable = []) {
  if (!levels.length || levels.every(l => l === null)) return el("td", "—", "none");
  const td = el("td");
  levels.forEach((l, i) => {
    if (i) td.append(" / ");
    td.append(l > 0 ? el("span", dimmable[i] === false ? "On" : `${l}%`, "lit") : l === 0 ? "Off" : "?");
  });
  return td;
}

function readButton(row) {
  const button = el("button", undefined, "read");
  button.type = "button";
  button.dataset.unit = row.unit;
  const outcome = outcomes.get(row.unit);
  if (data.reading?.unit === row.unit) {
    button.classList.add("busy");
    button.title = "Being read now (reading all devices)";
  } else if (reading.has(row.unit)) {
    button.classList.add("busy");
    button.title = "Reading…";
  } else if (outcome) {
    button.classList.add(outcome.cls);
    button.title = outcome.text;
  } else {
    button.title = "Read its state now";
  }
  button.setAttribute("aria-label", `Read ${row.name} state now`);
  button.disabled = !data.pim_connected || reading.has(row.unit);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("width", "18");
  svg.setAttribute("height", "18");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", ICON);
  path.setAttribute("fill", "currentColor");
  svg.append(path);
  button.append(svg);
  button.addEventListener("click", () => readDevice(row));
  return button;
}

async function readDevice(row) {
  if (reading.has(row.unit)) return;
  outcomes.delete(row.unit);
  reading.set(row.unit, { heard: row.last_heard, timeouts: row.timeouts, until: Date.now() + READ_WAIT_MS });
  renderRows();
  try {
    const response = await fetch(`refresh/${row.unit}`, { method: "POST" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
  } catch (err) {
    reading.delete(row.unit);
    outcomes.set(row.unit, { cls: "fail", text: `Couldn't send the read (${err.message})`,
                             until: Date.now() + OUTCOME_MS });
    renderRows();
    return;
  }
  schedule(FAST_REFRESH_MS);
}

// A read is done when the device is heard from, or its query times out
function settleReads() {
  const now = Date.now();
  for (const [unit, read] of reading) {
    const row = data.devices.find(r => r.unit === unit);
    if (row && row.last_heard !== read.heard) {
      outcomes.set(unit, { cls: "ok", text: "Answered", until: now + OUTCOME_MS });
    } else if (!row || row.timeouts > read.timeouts || now > read.until) {
      outcomes.set(unit, { cls: "fail", text: "No answer", until: now + OUTCOME_MS });
    } else {
      continue;
    }
    reading.delete(unit);
  }
  for (const [unit, outcome] of outcomes) {
    if (now > outcome.until) outcomes.delete(unit);
  }
}

// Value used for sorting; null always sorts last
function sortValue(row, key) {
  if (key === "name") return row.name.toLowerCase();
  if (key === "level") return row.level.some(l => l !== null) ? Math.max(...row.level.map(l => l ?? 0)) : null;
  if (key === "last_heard") return row.last_heard ? Date.parse(row.last_heard) : null;
  if (key === "pim") return row.pim ? `${row.pim}${row.tx_count}` : null;  // then single before repeated
  return row[key];
}

function renderHead() {
  const tr = document.getElementById("columns");
  headKeys = columns().map(([key]) => key).join();
  tr.replaceChildren(...columns().map(([key, label, tip]) => {
    const th = el("th", label);
    th.title = tip;
    th.scope = "col";
    if (sort.key === key) th.setAttribute("aria-sort", sort.dir > 0 ? "ascending" : "descending");
    th.addEventListener("click", () => {
      // Numbers are most useful biggest first; names A-Z
      sort = sort.key === key ? { key, dir: -sort.dir } : { key, dir: key === "name" ? 1 : -1 };
      store.set("upb-sort", sort);
      renderHead();
      renderRows();
    });
    return th;
  }));
}

function renderRows() {
  if (!data) return;
  const needle = document.getElementById("filter").value.trim().toLowerCase();
  const rows = data.devices.filter(r =>
    !needle || `${r.name} ${r.product ?? ""} ${r.unit} ${r.pim ? `pim ${r.pim}` : ""}`
      .toLowerCase().includes(needle));
  rows.sort((a, b) => {
    const x = sortValue(a, sort.key), y = sortValue(b, sort.key);
    if (x === y) return a.unit - b.unit;
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    return (x < y ? -1 : 1) * sort.dir;
  });

  const focused = document.activeElement?.dataset?.unit;
  document.getElementById("rows").replaceChildren(...rows.map(row => {
    const tr = el("tr");
    for (const [key] of columns()) {
      let td;
      if (key === "name") {
        td = el("td", undefined, row.pim ? `name pim-${row.pim}` : "name");
        const label = el("div", row.name);
        if (row.product) label.append(el("small", row.product));
        const device = el("div", undefined, "device");
        device.append(readButton(row), label);
        td.append(device);
      } else if (key === "level") {
        td = levelCell(row.level, row.dimmable);
      } else if (key === "pim") {
        td = el("td");
        if (row.pim) {
          const repeat = row.tx_count > 1;
          const chip = el("span", `PIM ${row.pim}${repeat ? ` ×${row.tx_count}` : ""}`,
                          `chip pim-${row.pim}${repeat ? " repeat" : ""}`);
          chip.title = row.tx_count > 1
            ? `Sent twice from PIM ${row.pim}: no PIM reaches it with one transmission`
            : `PIM ${row.pim} reaches it with one transmission`;
          td.append(chip);
        }
      } else if (key === "last_heard") {
        td = el("td", row.last_heard ? ago(row.last_heard) : "never", row.last_heard ? "" : "none");
        if (row.last_heard) td.title = new Date(row.last_heard).toLocaleString();
      } else {
        const value = row[key];
        td = el("td", value ?? "—", value === null ? "none" : "");
        if (key === "timeouts" && value > 0) td.className = "warn";
      }
      tr.append(td);
    }
    return tr;
  }));
  if (focused) document.querySelector(`button.read[data-unit="${focused}"]`)?.focus();

  const totals = document.getElementById("totals");
  totals.replaceChildren(...columns().map(([key], i) => {
    if (i === 0) return el("td", `${rows.length} of ${data.devices.length} devices`);
    if (key === "pim") return pimCounts(rows);
    return el("td", SUMMED.includes(key) ? rows.reduce((sum, r) => sum + r[key], 0) : "");
  }));
}

// Devices per PIM, each with its colour dot
function pimCounts(rows) {
  const td = el("td", undefined, "counts");
  (data.pims ?? []).forEach((_, i) => {
    const name = PIM_NAMES[i];
    const count = el("span", undefined, `pim-${name}`);
    count.title = `Devices PIM ${name} sends to`;
    count.append(el("span", undefined, "dot"), `${rows.filter(r => r.pim === name).length}`);
    td.append(count);
  });
  return td;
}

// A read of all devices: how far it's got, and the device being queried
function renderProgress() {
  const r = data.reading;
  const progress = document.getElementById("progress");
  progress.hidden = !r;
  if (!r) return;
  const now = r.unit == null ? "" : ` · unit ${r.unit}${r.pim ? ` via PIM ${r.pim}` : ""}`;
  document.getElementById("progress-text").textContent = r.waiting
    ? "Waiting for the PIMs to connect before reading devices"
    : `Reading devices ${r.done} of ${r.total}${now}`;
  const bar = document.getElementById("progress-bar");
  bar.style.width = `${r.total ? (100 * r.done) / r.total : 0}%`;
  bar.parentElement.setAttribute("aria-valuenow", r.done);
  bar.parentElement.setAttribute("aria-valuemax", r.total);
}

// One pill per PIM: its colour (the legend for the rows), whether it's
// connected, and how many devices it sends to; its dot pulses while it
// queries a device for a read of all devices
function renderStatus() {
  renderProgress();
  const pims = data.pims ?? [data.pim_connected];
  document.getElementById("pims").replaceChildren(...pims.map((up, i) => {
    const pill = el("span", undefined, `pill ${up ? "on" : "off"}`);
    if (pims.length === 1) {
      pill.textContent = up ? "PIM connected" : "PIM disconnected";
      return pill;
    }
    const name = PIM_NAMES[i];
    const devices = data.devices.filter(r => r.pim === name).length;
    pill.classList.add(`pim-${name}`);
    if (data.reading?.pim === name) pill.classList.add("querying");
    pill.append(el("span", undefined, "dot"),
                `PIM ${name} ${up ? "connected" : "disconnected"} · ${devices} devices`);
    return pill;
  }));
  document.getElementById("since").textContent =
    `Counting since ${new Date(data.since).toLocaleString()} · tx_count ${data.tx_count}`;
}

function schedule(ms) {
  clearTimeout(timer);
  timer = setTimeout(load, ms);
}

async function load() {
  try {
    const response = await fetch("stats.json", { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    data = await response.json();
    document.getElementById("error").textContent = "";
    settleReads();
    if (columns().map(([key]) => key).join() !== headKeys) renderHead();
    renderStatus();
    renderRows();
  } catch (err) {
    document.getElementById("error").textContent = `Can't reach the add-on (${err.message})`;
  } finally {
    schedule(reading.size || data?.reading ? FAST_REFRESH_MS : REFRESH_MS);
  }
}

document.getElementById("filter").addEventListener("input", renderRows);
renderHead();
load();
</script>
</body>
</html>
