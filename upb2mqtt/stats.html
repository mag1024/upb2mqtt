<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPB devices</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa; --card: #ffffff; --text: #212121; --muted: #727272;
    --line: #e0e0e0; --head: #f3f3f3; --accent: #03a9f4; --hover: #f5f9fc;
    --ok: #2e7d32; --bad: #c62828; --warn-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111; --card: #1c1c1c; --text: #e1e1e1; --muted: #9b9b9b;
      --line: #2f2f2f; --head: #232323; --accent: #4fc3f7; --hover: #242a2e;
      --ok: #81c784; --bad: #ef9a9a; --warn-bg: #3b2020;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 14px/1.4 Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
  h1 { font-size: 20px; font-weight: 500; margin: 0; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 12px; border: 1px solid currentColor; }
  .pill.on { color: var(--ok); } .pill.off { color: var(--bad); }
  .meta { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  input[type=search] {
    font: inherit; padding: 6px 10px; min-width: 200px; max-width: 100%;
    border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--text);
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: calc(100vh - 90px); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: inherit; }
  thead th {
    position: sticky; top: 0; z-index: 1; background: var(--head); font-weight: 500;
    cursor: pointer; user-select: none;
  }
  thead th:first-child { z-index: 2; }
  thead th:hover { color: var(--accent); }
  thead th[aria-sort] { color: var(--accent); }
  thead th[aria-sort=ascending]::after { content: " \25B2"; font-size: 10px; }
  thead th[aria-sort=descending]::after { content: " \25BC"; font-size: 10px; }
  tbody tr { background: var(--card); }
  tbody tr:hover { background: var(--hover); }
  td.name { font-weight: 500; }
  td.name small { display: block; font-weight: 400; color: var(--muted); }
  .none { color: var(--muted); }
  td.warn { color: var(--bad); background: var(--warn-bg); font-weight: 500; }
  tfoot td { font-weight: 500; background: var(--head); position: sticky; bottom: 0; }
  #error { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>UPB devices</h1>
  <span id="pim" class="pill">…</span>
  <span id="since" class="meta"></span>
  <span id="error" class="meta"></span>
  <span class="spacer"></span>
  <input id="filter" type="search" placeholder="Filter devices" aria-label="Filter devices">
</header>
<div class="card">
  <table>
    <thead><tr id="columns"></tr></thead>
    <tbody id="rows"></tbody>
    <tfoot><tr id="totals"></tr></tfoot>
  </table>
</div>
<script>
"use strict";
// Columns: key in stats.json, heading, tooltip, how to show a value
const COLUMNS = [
  ["name", "Device", "Name in UPStart, and product"],
  ["unit", "Unit", "UPB unit ID"],
  ["level", "State", "Current level of each channel"],
  ["state_changes", "Changes", "Times its lights changed state"],
  ["sent", "Sent", "Commands the bridge sent to it"],
  ["sent_scene", "Scene", "Scene (link) commands the bridge sent that it hears"],
  ["queries", "Queries", "State reads the bridge sent"],
  ["observed", "Observed", "Traffic from anyone else: keypad and local presses, other controllers"],
  ["timeouts", "Timeouts", "Queries it didn't answer"],
  ["latency_ms", "Latency", "Reply time of the last state query (ms), from the PIM accepting it"],
  ["tx_count", "TX", "Transmit count in use"],
  ["last_heard", "Last heard", "When it last sent anything"],
];
const SUMMED = ["state_changes", "sent", "sent_scene", "queries", "observed", "timeouts"];
const REFRESH_MS = 5000;

const store = {
  get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode */ } },
};
let sort = store.get("upb-sort") || { key: "name", dir: 1 };
let data = null;

const el = (tag, text, cls) => {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
};

function ago(iso) {
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 60) return `${Math.round(s)} s ago`;
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${(s / 3600).toFixed(1)} h ago`;
  return `${(s / 86400).toFixed(1)} d ago`;
}

function levelText(levels) {
  if (!levels.length || levels.every(l => l === null)) return null;
  return levels.map(l => l === null ? "?" : l === 0 ? "Off" : `${l}%`).join(" / ");
}

// Value used for sorting; null always sorts last
function sortValue(row, key) {
  if (key === "name") return row.name.toLowerCase();
  if (key === "level") return row.level.some(l => l !== null) ? Math.max(...row.level.map(l => l ?? 0)) : null;
  if (key === "last_heard") return row.last_heard ? Date.parse(row.last_heard) : null;
  return row[key];
}

function renderHead() {
  const tr = document.getElementById("columns");
  tr.replaceChildren(...COLUMNS.map(([key, label, tip]) => {
    const th = el("th", label);
    th.title = tip;
    th.scope = "col";
    if (sort.key === key) th.setAttribute("aria-sort", sort.dir > 0 ? "ascending" : "descending");
    th.addEventListener("click", () => {
      // Numbers are most useful biggest first; names A-Z
      sort = sort.key === key ? { key, dir: -sort.dir } : { key, dir: key === "name" ? 1 : -1 };
      store.set("upb-sort", sort);
      renderHead();
      renderRows();
    });
    return th;
  }));
}

function renderRows() {
  if (!data) return;
  const needle = document.getElementById("filter").value.trim().toLowerCase();
  const rows = data.devices.filter(r =>
    !needle || `${r.name} ${r.product ?? ""} ${r.unit}`.toLowerCase().includes(needle));
  rows.sort((a, b) => {
    const x = sortValue(a, sort.key), y = sortValue(b, sort.key);
    if (x === y) return a.unit - b.unit;
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    return (x < y ? -1 : 1) * sort.dir;
  });

  document.getElementById("rows").replaceChildren(...rows.map(row => {
    const tr = el("tr");
    for (const [key] of COLUMNS) {
      let td;
      if (key === "name") {
        td = el("td", row.name, "name");
        if (row.product) td.append(el("small", row.product));
      } else if (key === "level") {
        const text = levelText(row.level);
        td = el("td", text ?? "—", text ? "" : "none");
      } else if (key === "last_heard") {
        td = el("td", row.last_heard ? ago(row.last_heard) : "never", row.last_heard ? "" : "none");
        if (row.last_heard) td.title = new Date(row.last_heard).toLocaleString();
      } else {
        const value = row[key];
        td = el("td", value ?? "—", value === null ? "none" : "");
        if (key === "timeouts" && value > 0) td.className = "warn";
      }
      tr.append(td);
    }
    return tr;
  }));

  const totals = document.getElementById("totals");
  totals.replaceChildren(...COLUMNS.map(([key], i) => {
    if (i === 0) return el("td", `${rows.length} of ${data.devices.length} devices`);
    return el("td", SUMMED.includes(key) ? rows.reduce((sum, r) => sum + r[key], 0) : "");
  }));
}

function renderStatus() {
  const pim = document.getElementById("pim");
  pim.textContent = data.pim_connected ? "PIM connected" : "PIM disconnected";
  pim.className = `pill ${data.pim_connected ? "on" : "off"}`;
  document.getElementById("since").textContent =
    `Counting since ${new Date(data.since).toLocaleString()} · tx_count ${data.tx_count}`;
}

async function refresh() {
  try {
    const response = await fetch("stats.json", { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    data = await response.json();
    document.getElementById("error").textContent = "";
    renderStatus();
    renderRows();
  } catch (err) {
    document.getElementById("error").textContent = `Can't reach the add-on (${err.message})`;
  }
}

document.getElementById("filter").addEventListener("input", renderRows);
renderHead();
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
