configuration:
  pim_url:
    name: Primary PIM (A)
    description: >-
      Serial device (e.g. /dev/serial/by-id/usb-...) or network URL
      (socket://host:port) of the UPB PIM. Required. Devices are tried from
      this PIM first.
  pim_b_url:
    name: Secondary PIM (B), optional
    description: >-
      Optional. A second PIM on the other powerline phase (leg) from the
      primary, as a serial device or socket://host:port. With tx_count auto,
      each message goes out on whichever PIM reaches its devices with fewer
      transmissions; either PIM keeps UPB working while the other is
      disconnected. Leave empty for one PIM.
  upe_file:
    name: UPStart export file
    description: Path to the UPStart .upe export. The HA config folder is at /homeassistant.
  tx_count:
    name: Transmit count
    description: >-
      Send each UPB message this many times: 1, 2, or auto (learn which
      devices answer a single transmission and send 2 to the rest, and to any
      scene one of those is in). Overrides tx_count in the UPE file.
  keypad_sync:
    name: Keypad LED sync
    description: >-
      Keep keypad button LEDs (and so their toggle state) in step with the
      lights their scenes control, when lights are changed directly.
  keypad_scene_match:
    name: Keypad scene match
    description: >-
      When a scene with several lights counts as on for its LED: "all" when
      every light is on, "any" when at least one is.
  batch_window:
    name: Group batching window (seconds)
    description: >-
      Hold light commands this long so that a light group's commands arrive
      together; where a scene sets exactly those lights, send the scene
      instead. Default 0.15 when not set; 0 disables.
  topic_prefix:
    name: Topic prefix
  discovery_prefix:
    name: Discovery prefix
  mqtt_host:
    name: MQTT host
    description: Leave empty to use the broker provided by the Mosquitto add-on.
  mqtt_port:
    name: MQTT port
  mqtt_username:
    name: MQTT username
  mqtt_password:
    name: MQTT password
  log_level:
    name: Log level
