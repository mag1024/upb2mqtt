name: upb2mqtt
version: "0.5.0"
slug: upb2mqtt
description: Universal Powerline Bus (UPB) PIM to MQTT, with Home Assistant discovery
url: https://gitea.ctl.luminal.org/mag/upb2mqtt
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
uart: true
services:
  - mqtt:want
map:
  - type: homeassistant_config
    read_only: true
options:
  pim_url: ""
  upe_file: /homeassistant/network.upe
  tx_count: auto
  refresh_hours: 0
  keypad_sync: true
  keypad_scene_match: all
  batch_window: 0.15
  topic_prefix: upb
  discovery_prefix: homeassistant
  log_level: info
schema:
  pim_url: str
  upe_file: str
  tx_count: list(1|2|auto)
  refresh_hours: int(0,168)
  keypad_sync: bool
  keypad_scene_match: list(all|any)
  batch_window: float(0,2)
  topic_prefix: str
  discovery_prefix: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  log_level: list(debug|info|warning|error)
